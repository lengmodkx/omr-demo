# ============================================================
# 生产环境 compose 文件 — 使用预构建镜像，不在服务器上编译
# 用法: docker compose -f docker-compose.prod.yml up -d
# ============================================================
version: "3.8"

services:
  omr-service:
    image: omr-service:latest    # 使用本地已加载的镜像，不构建
    container_name: omr-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./output:/app/output
      - ./omr_service/templates:/app/omr_service/templates
    environment:
      OMR_HTTP_HOST: 0.0.0.0
      OMR_HTTP_PORT: 8080
      OMR_NACOS_SERVER: ${NACOS_SERVER}
      OMR_NACOS_NAMESPACE: ${NACOS_NAMESPACE:-public}
      OMR_NACOS_GROUP: ${NACOS_GROUP:-DEFAULT_GROUP}
      OMR_NACOS_DATA_ID: ${NACOS_DATA_ID:-omr-service.yaml}
      OMR_REDIS_HOST: ${REDIS_HOST:-127.0.0.1}
      OMR_REDIS_PORT: ${REDIS_PORT:-6379}
      OMR_REDIS_DB: ${REDIS_DB:-4}
      OMR_CONSUMER_ENABLED: "true"
      OMR_WORKER_POOL_SIZE: "4"
